<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hidden Genius Invitational</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.5;
        color: #1f2933;
        background: #f7f9fc;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        max-width: 720px;
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
        padding: 42px;
        text-align: center;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 5vw, 3.25rem);
        line-height: 1.1;
      }

      p {
        margin: 0 auto 28px;
        max-width: 560px;
        color: #52616f;
        font-size: 1.1rem;
      }

      .download-button {
        display: inline-block;
        border-radius: 999px;
        background: #0f62fe;
        color: #ffffff;
        font-weight: 700;
        padding: 14px 24px;
        text-decoration: none;
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .download-button:hover,
      .download-button:focus {
        box-shadow: 0 10px 22px rgba(15, 98, 254, 0.28);
        transform: translateY(-1px);
      }

      .note {
        margin-top: 20px;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hidden Genius Invitational</h1>
      <p>
        Download the PDF packet below to view the details, save a copy, or
        share it with someone else.
      </p>
      <a
        class="download-button"
        href="documents/hidden-genius-invitational.pdf"
        download
      >
        Download PDF
      </a>
      <p class="note">
        If the download does not start automatically, right-click the button
        and choose "Save link as".
      </p>
    </main>
  </body>
</html>
